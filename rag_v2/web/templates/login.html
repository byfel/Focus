<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • FOCUS AI v2</title>
    
    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body.login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #090D16;
            position: relative;
            overflow: hidden;
            padding: 24px;
        }

        /* Ambient glowing background orbs */
        .ambient-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(140px);
            pointer-events: none;
            opacity: 0.45;
            z-index: 0;
            animation: floatGlow 14s ease-in-out infinite alternate;
        }

        .glow-1 {
            top: -10%;
            left: -5%;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, #005BF6 0%, rgba(0, 91, 246, 0) 70%);
        }

        .glow-2 {
            bottom: -15%;
            right: -5%;
            width: 650px;
            height: 650px;
            background: radial-gradient(circle, #7928CA 0%, rgba(121, 40, 202, 0) 70%);
            animation-delay: -7s;
        }

        .glow-3 {
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #00C6FF 0%, rgba(0, 198, 255, 0) 70%);
            opacity: 0.15;
        }

        @keyframes floatGlow {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.15) translate(40px, -30px); }
        }

        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: rgba(19, 26, 43, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 44px 36px;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.65), 
                        0 0 0 1px rgba(255, 255, 255, 0.05),
                        0 0 40px rgba(0, 91, 246, 0.15);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .globo-orb {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0066FF 0%, #7928CA 50%, #FF007A 100%);
            padding: 2px;
            box-shadow: 0 10px 30px rgba(0, 102, 255, 0.4), 0 0 20px rgba(121, 40, 202, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulseOrb 4s ease-in-out infinite;
        }

        @keyframes pulseOrb {
            0%, 100% { transform: scale(1); box-shadow: 0 10px 30px rgba(0, 102, 255, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 15px 40px rgba(121, 40, 202, 0.5); }
        }

        .globo-orb-inner {
            width: 100%;
            height: 100%;
            background: #0E1526;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #FFFFFF 30%, #93C5FD 70%, #C084FC 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .v2-badge {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 3px 8px;
            border-radius: 12px;
            background: linear-gradient(135deg, #0066FF, #7928CA);
            color: #FFFFFF;
            -webkit-text-fill-color: #FFFFFF;
            box-shadow: 0 2px 8px rgba(0, 102, 255, 0.4);
        }

        .brand-subtitle {
            margin-top: 8px;
            font-size: 13.5px;
            color: #94A3B8;
            font-weight: 500;
        }

        .pipeline-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            padding: 4px 12px;
            background: rgba(0, 102, 255, 0.12);
            border: 1px solid rgba(0, 102, 255, 0.25);
            border-radius: 20px;
            font-size: 11.5px;
            color: #60A5FA;
            font-weight: 600;
        }

        .pipeline-pill .dot {
            width: 6px;
            height: 64px;
            height: 6px;
            border-radius: 50%;
            background: #10B981;
            box-shadow: 0 0 8px #10B981;
        }

        /* Test credentials button */
        .test-cred-box {
            background: rgba(0, 102, 255, 0.08);
            border: 1px dashed rgba(96, 165, 250, 0.35);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .test-cred-box:hover {
            background: rgba(0, 102, 255, 0.15);
            border-color: rgba(96, 165, 250, 0.6);
            transform: translateY(-1px);
        }

        .test-cred-text {
            font-size: 12.5px;
            color: #93C5FD;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .test-cred-badge {
            font-size: 10.5px;
            background: rgba(96, 165, 250, 0.2);
            padding: 3px 8px;
            border-radius: 6px;
            color: #BFDBFE;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #E2E8F0;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: #64748B;
            pointer-events: none;
            transition: color 0.2s;
        }

        .form-input {
            width: 100%;
            padding: 13px 16px 13px 44px;
            background: rgba(13, 20, 36, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #FFFFFF;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.25s ease;
        }

        .form-input:focus {
            border-color: #0066FF;
            background: rgba(13, 20, 36, 0.9);
            box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.25);
        }

        .form-input:focus + .input-icon,
        .form-input:not(:placeholder-shown) + .input-icon {
            color: #60A5FA;
        }

        .submit-btn {
            width: 100%;
            padding: 14px 20px;
            margin-top: 10px;
            background: linear-gradient(135deg, #0066FF 0%, #7928CA 100%);
            border: none;
            border-radius: 12px;
            color: #FFFFFF;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 102, 255, 0.35);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 12px 28px rgba(0, 102, 255, 0.45);
        }

        .submit-btn:active {
            transform: translateY(1px);
        }

        .error-alert {
            display: none;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #FCA5A5;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            align-items: center;
            gap: 8px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-footer {
            margin-top: 28px;
            text-align: center;
            font-size: 12px;
            color: #64748B;
        }
    </style>
</head>
<body class="login-page">

    <!-- Glowing Background Ambient Orbs -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="ambient-glow glow-3"></div>

    <div class="login-card">
        <div class="brand-header">
            <div class="globo-orb">
                <div class="globo-orb-inner">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="url(#globoGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <defs>
                            <linearGradient id="globoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#38BDF8" />
                                <stop offset="100%" stop-color="#C084FC" />
                            </linearGradient>
                        </defs>
                        <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/>
                        <circle cx="12" cy="12" r="3.5" fill="url(#globoGrad)" stroke="none"/>
                    </svg>
                </div>
            </div>

            <h1 class="brand-title">
                FOCUS AI <span class="v2-badge">v2</span>
            </h1>
            <p class="brand-subtitle">Assistente de Engenharia & Tecnologia</p>
            <div class="pipeline-pill">
                <span class="dot"></span>
                <span>nomic-embed-text • Qdrant v2</span>
            </div>
        </div>

        <!-- Botão de preenchimento rápido de teste -->
        <div class="test-cred-box" id="fillTestCreds" title="Clique para preencher as credenciais de teste automaticamente">
            <div class="test-cred-text">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <span>Usuário de teste: <strong>admin</strong> / <strong>admin123</strong></span>
            </div>
            <span class="test-cred-badge">Preencher</span>
        </div>

        <div class="error-alert" id="errorAlert">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span id="errorMessage">Credenciais inválidas.</span>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="username">Usuário</label>
                <div class="input-wrapper">
                    <input type="text" id="username" class="form-input" placeholder="Digite seu usuário corporativo" required autofocus autocomplete="username">
                    <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Senha</label>
                <div class="input-wrapper">
                    <input type="password" id="password" class="form-input" placeholder="Digite sua senha" required autocomplete="current-password">
                    <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <span>Entrar no Sistema</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="5" y1="12" x2="19" y2="12"/>
                    <polyline points="12 5 19 12 12 19"/>
                </svg>
            </button>
        </form>

        <div class="login-footer">
            Autenticação Local & Suporte a LDAP Corporativo
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const errorAlert = document.getElementById('errorAlert');
        const errorMessage = document.getElementById('errorMessage');
        const fillTestCreds = document.getElementById('fillTestCreds');

        // Preenchimento de teste com 1 clique
        fillTestCreds.addEventListener('click', () => {
            usernameInput.value = 'admin';
            passwordInput.value = 'admin123';
            usernameInput.focus();
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorAlert.style.display = 'none';

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) return;

            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <svg class="animate-spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-dashoffset="12"/>
                </svg>
                <span>Autenticando...</span>
            `;

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    window.location.href = '/';
                } else {
                    const data = await response.json().catch(() => ({}));
                    errorMessage.textContent = data.detail || 'Usuário ou senha inválidos.';
                    errorAlert.style.display = 'flex';
                }
            } catch (err) {
                errorMessage.textContent = 'Erro de conexão com o servidor.';
                errorAlert.style.display = 'flex';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `
                    <span>Entrar no Sistema</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                `;
            }
        });
    </script>
</body>
</html>
