<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOCUS AI • RAG v2</title>

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="/" class="sidebar-brand">
                    <div class="brand-icon-orb">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="9"/>
                            <circle cx="12" cy="12" r="3.2" fill="#FFFFFF" stroke="none"/>
                        </svg>
                    </div>
                    <span class="brand-name">FOCUS AI</span>
                    <span class="brand-tag">v2</span>
                </a>
            </div>

            <button class="new-chat-btn" id="newChatBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                <span>Nova conversa</span>
            </button>

            <div class="model-picker-container">
                <div class="model-picker-label">
                    <span>Modelo de Linguagem</span>
                    <span style="font-size: 10px; color: #60A5FA;">LLM</span>
                </div>
                <select class="model-select" id="modelSelect">
                    <option value="gemma3:12b" selected>gemma3:12b (Recomendado)</option>
                    <option value="gemma3:4b">gemma3:4b (Mais rápido)</option>
                    <option value="gemma4:12b">gemma4:12b</option>
                    <option value="qwen3.6:27b">qwen3.6:27b</option>
                </select>
            </div>

            <!-- List of past conversations -->
            <div class="sidebar-history" id="conversationList">
                <!-- Injected dynamically via app.js -->
            </div>

            <!-- User profile & logout footer -->
            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar">AD</div>
                    <div class="user-info">
                        <span class="user-name" id="currentUserDisplay">admin</span>
                        <span class="user-role">Engenharia & Suporte</span>
                    </div>
                </div>

                <button class="logout-btn" id="logoutBtn" title="Encerrar sessão">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <!-- Navbar Header -->
            <header class="chat-navbar">
                <div class="nav-left">
                    <button class="toggle-sidebar-btn" id="toggleSidebarBtn" title="Alternar barra lateral">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="3" y1="12" x2="21" y2="12"/>
                            <line x1="3" y1="6" x2="21" y2="6"/>
                            <line x1="3" y1="18" x2="21" y2="18"/>
                        </svg>
                    </button>
                    <h2 class="chat-header-title" id="chatHeaderTitle">Nova conversa</h2>
                </div>

                <div class="nav-right">
                    <div class="pipeline-badge" title="Indexação em lote via nomic-embed-text no Qdrant v2">
                        <span class="indicator-dot"></span>
                        <span>nomic-embed-text (768d)</span>
                    </div>
                </div>
            </header>

            <!-- Scrollable Messages Container -->
            <div class="messages-container" id="messagesContainer">
                <div class="messages-content" id="messagesContent">
                    <!-- Injected dynamically via app.js -->
                </div>
            </div>

            <!-- Bottom Floating Chat Input -->
            <div class="chat-input-area">
                <div class="input-box-container">
                    <textarea 
                        id="chatInput" 
                        class="chat-textarea" 
                        placeholder="Pergunte sobre Autodesk Flame, Media Composer, Dante, PCoIP, Linux..." 
                        rows="1"
                    ></textarea>

                    <button id="sendBtn" class="send-btn" disabled title="Enviar mensagem (Enter)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                </div>

                <div class="input-disclaimer">
                    FOCUS AI v2 • nomic-embed-text • Respostas geradas estritamente a partir dos manuais e documentos técnicos.
                </div>
            </div>
        </main>
    </div>

    <!-- Application Script -->
    <script src="/static/js/app.js"></script>
</body>
</html>
