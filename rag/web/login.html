<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPORTE AI</title>
    
    <!-- Importando fonte moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Fundo moderno com gradiente fluido */
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-box {
            /* Efeito Glassmorphism */
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-subtitle {
            margin-top: 6px;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 500;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        input::placeholder {
            color: #64748b;
        }

        /* Efeito moderno de foco no input */
        input:focus {
            border-color: #3b82f6;
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px -6px rgba(79, 70, 229, 0.5);
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .error {
            display: none;
            margin-bottom: 20px;
            padding: 12px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 8px;
            color: #fca5a5;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-box">
        <div class="logo">
            <div class="logo-title">SUPORTE AI</div>
            <div class="logo-subtitle">Assistente Técnico</div>
        </div>

        <div id="error" class="error"></div>

        <form id="loginForm">
            <label for="username">Usuário corporativo</label>
            <input id="username" type="text" autocomplete="username" placeholder="Digite seu usuário" required>

            <label for="password">Senha</label>
            <input id="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>

            <button id="loginButton" type="submit">ENTRAR</button>
        </form>

        <div class="footer">Autenticação corporativa</div>
    </div>
</div>

<script>
    // A lógica JavaScript original permanece exatamente a mesma
    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const error = document.getElementById("error");

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        error.style.display = "none";
        button.disabled = true;
        button.textContent = "AUTENTICANDO...";

        try {
            const response = await fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || "Falha na autenticação.");
            }
            window.location.href = "/app";

        } catch (err) {
            error.textContent = err.message;
            error.style.display = "block";
        } finally {
            button.disabled = false;
            button.textContent = "ENTRAR";
        }
    });
</script>

</body>
</html>
